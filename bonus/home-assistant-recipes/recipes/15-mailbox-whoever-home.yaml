# Recipe 15: Tell only the people who are home
# When the mailbox sensor opens during the day, every person who is at home gets a message, and people who are away are not bothered.
alias: Mailbox opened - tell whoever is home
triggers:
  - trigger: state
    entity_id: binary_sensor.mailbox
    to: "on"
conditions:
  - condition: time
    after: "08:00:00"
    before: "20:00:00"
actions:
  - repeat:
      for_each:
        - person: person.anna
          notify: notify.mobile_app_anna_phone
        - person: person.ben
          notify: notify.mobile_app_ben_phone
      sequence:
        - if:
            - condition: template
              value_template: >
                {{ is_state(repeat.item.person, 'home') }}
          then:
            - action: "{{ repeat.item.notify }}"
              data:
                title: Mailbox
                message: The mailbox was opened.
