# Recipe 18: One battery message on Sunday instead of ten warnings
# Every Sunday morning one message lists every battery sensor below 20 percent. If all are fine, you hear nothing.
alias: Sunday battery digest
triggers:
  - trigger: time
    at: "10:00:00"
conditions:
  - condition: time
    weekday:
      - sun
actions:
  - variables:
      low: >
        {% set ns = namespace(items=[]) %}
        {% for s in states.sensor
           if s.attributes.device_class | default('')
              == 'battery'
           and s.state | float(100) < 20 %}
          {% set ns.items = ns.items
             + [s.name ~ ' ' ~ s.state ~ '%'] %}
        {% endfor %}
        {{ ns.items | join(', ') }}
  - if:
      - condition: template
        value_template: "{{ low != '' }}"
    then:
      - action: notify.mobile_app_anna_phone
        data:
          title: Batteries below 20%
          message: "{{ low }}"
