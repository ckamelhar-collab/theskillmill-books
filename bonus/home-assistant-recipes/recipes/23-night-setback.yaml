# Recipe 23: Lower the heating at night, restore it in the morning
# The thermostat switches to its eco preset at 22:30 and back to normal at 06:00. One automation, two triggers.
alias: Heating - night setback
triggers:
  - trigger: time
    at: "22:30:00"
    id: night
  - trigger: time
    at: "06:00:00"
    id: morning
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: night
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.living_room
            data:
              preset_mode: eco
      - conditions:
          - condition: trigger
            id: morning
        sequence:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.living_room
            data:
              preset_mode: home
