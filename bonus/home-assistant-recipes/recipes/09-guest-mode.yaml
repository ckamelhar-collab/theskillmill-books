# Recipe 9: A guest mode that pauses the "nobody home" rules
# One switch on your dashboard tells the house that visitors are staying, so it stops treating an empty-looking house as an empty house.
alias: Guest mode on and off
triggers:
  - trigger: state
    entity_id: input_boolean.guest_mode
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_boolean.guest_mode
            state: "on"
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.house_mode
            data:
              option: Guests
    default:
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: Home
