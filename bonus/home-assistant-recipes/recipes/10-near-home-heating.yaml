# Recipe 10: Warm the house when you are nearly home
# When the first person crosses a circle you draw around your neighbourhood, and the house is cool, the living room starts heating.
alias: Heat on when someone is near home
triggers:
  - trigger: zone.entered
    target:
      entity_id:
        - person.anna
        - person.ben
    options:
      zone: zone.near_home
conditions:
  - condition: state
    entity_id: input_select.house_mode
    state: Away
  - condition: numeric_state
    entity_id: sensor.living_room_temperature
    below: 19
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.living_room
    data:
      temperature: 21
      hvac_mode: heat
