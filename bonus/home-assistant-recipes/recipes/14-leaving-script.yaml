# Recipe 14: One "leaving" script for buttons, voice and automations
# One script does everything that belongs to leaving: lights off, the door locked, heating in eco mode, house mode set to Away. A button, a voice command or another automation can run it.
alias: Leaving the house
fields:
  lock_door:
    name: Lock the front door
    default: true
    selector:
      boolean: {}
sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - if:
      - condition: template
        value_template: "{{ lock_door }}"
    then:
      - action: lock.lock
        target:
          entity_id: lock.front_door
  - action: climate.set_preset_mode
    target:
      entity_id: climate.living_room
    data:
      preset_mode: eco
  - action: input_select.select_option
    target:
      entity_id: input_select.house_mode
    data:
      option: Away
