# Recipe 6: A bedtime fade-out
# Press a button on the dashboard and the bedroom light fades down over two minutes, then turns off, so you can read until it is dark.
alias: Bedroom fade-out at bedtime
triggers:
  - trigger: state
    entity_id: input_button.bedtime
actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 5
      transition: 120
  - delay:
      minutes: 3
  - action: light.turn_off
    target:
      entity_id: light.bedroom
