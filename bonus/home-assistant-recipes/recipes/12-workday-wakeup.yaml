# Recipe 12: A different wake-up on workdays and holidays
# The bedroom light fades up at 06:45, but only on days that are neither a weekend nor a public holiday in your region.
alias: Wake-up light on workdays only
triggers:
  - trigger: time
    at: "06:45:00"
conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 25
      color_temp_kelvin: 2700
      transition: 300
