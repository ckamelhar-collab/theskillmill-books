# Recipe 4: The pantry light follows the door
# The light comes on when the pantry door opens, goes off when it closes, and goes off anyway after 15 minutes if somebody forgets the door.
alias: Pantry light follows the door
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "on"
    id: opened
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "off"
    id: closed
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "on"
    for:
      minutes: 15
    id: forgotten
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.pantry
      - conditions:
          - condition: trigger
            id:
              - closed
              - forgotten
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.pantry
