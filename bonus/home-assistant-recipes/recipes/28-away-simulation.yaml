# Recipe 28: Make an empty house look lived in
# While you are on holiday, a lamp goes on shortly after sunset at a slightly different time each evening, and goes off a random 90 to 150 minutes later.
alias: Away simulation - evening lamp
triggers:
  - trigger: sun.sunset
    options:
      offset:
        minutes: 20
      offset_type: after
conditions:
  - condition: state
    entity_id: input_boolean.holiday_mode
    state: "on"
actions:
  - delay:
      minutes: "{{ range(0, 25) | random }}"
  - action: light.turn_on
    target:
      entity_id: light.living_room_lamp
    data:
      brightness_pct: 50
  - delay:
      minutes: "{{ range(90, 150) | random }}"
  - action: light.turn_off
    target:
      entity_id: light.living_room_lamp
