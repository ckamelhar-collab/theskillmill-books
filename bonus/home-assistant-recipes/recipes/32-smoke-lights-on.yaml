# Recipe 32: Smoke detected: every light on and a loud message
# When a smoke detector that Home Assistant can see reports smoke, every light in the house switches on at full and your phone alerts you loudly.
alias: Smoke - all lights on, alert phone
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.smoke_hallway
      - binary_sensor.smoke_kitchen
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: all
    data:
      brightness_pct: 100
  - action: notify.mobile_app_anna_phone
    data:
      title: Smoke
      message: Smoke detected at home. Check the house.
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
        ttl: 0
        priority: high
