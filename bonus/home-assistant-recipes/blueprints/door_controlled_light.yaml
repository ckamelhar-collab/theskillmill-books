blueprint:
  name: Door-controlled light
  description: >
    Light on when the door opens, off when it closes,
    and off anyway if the door is forgotten open.
  domain: automation
  input:
    door:
      name: Door sensor
      selector:
        entity:
          filter:
            - domain: binary_sensor
    lamp:
      name: Light
      selector:
        target:
          entity:
            domain: light
    forget_minutes:
      name: Switch off after
      default: 15
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: minutes
mode: restart
triggers:
  - trigger: state
    entity_id: !input door
    to: "on"
    id: opened
  - trigger: state
    entity_id: !input door
    to: "off"
    id: closed
  - trigger: state
    entity_id: !input door
    to: "on"
    for:
      minutes: !input forget_minutes
    id: forgotten
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - action: light.turn_on
            target: !input lamp
      - conditions:
          - condition: trigger
            id:
              - closed
              - forgotten
        sequence:
          - action: light.turn_off
            target: !input lamp
