# Rezept 13: Ein Filmmodus, der alles wieder zurückstellt
# Ein Skript dimmt den Raum und schließt die Rollläden, ein zweites bringt jede Lampe und jeden Rollladen genau in den Zustand von vorher zurück.
alias: Filmmodus ein
sequence:
  - action: scene.create
    data:
      scene_id: before_movie
      snapshot_entities:
        - light.living_room
        - light.kitchen
        - cover.living_room_blinds
  - action: light.turn_off
    target:
      entity_id: light.kitchen
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      brightness_pct: 10
  - action: cover.close_cover
    target:
      entity_id: cover.living_room_blinds
---
alias: Filmmodus aus
sequence:
  - action: scene.turn_on
    target:
      entity_id: scene.before_movie
