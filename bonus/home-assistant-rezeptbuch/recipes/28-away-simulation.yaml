# Rezept 28: Ein leeres Haus bewohnt aussehen lassen
# Solange du im Urlaub bist, geht kurz nach Sonnenuntergang jeden Abend zu einer leicht anderen Zeit eine Lampe an und 90 bis 150 Minuten später zufällig wieder aus.
alias: Anwesenheitssimulation - Abendlampe
triggers:
  - trigger: sun.sunset
    options:
      offset:
        minutes: 20
      offset_type: after
conditions:
  - condition: state
    entity_id: input_boolean.holiday_mode
    state: "on"
actions:
  - delay:
      minutes: "{{ range(0, 25) | random }}"
  - action: light.turn_on
    target:
      entity_id: light.living_room_lamp
    data:
      brightness_pct: 50
  - delay:
      minutes: "{{ range(90, 150) | random }}"
  - action: light.turn_off
    target:
      entity_id: light.living_room_lamp
