# Rezept 3: Ein Knopf schaltet die Abendlichter aus
# Ein Druck auf einen Wandtaster oder eine Fernbedienung schaltet jede Lampe aus, die das Label „Gute-Nacht-Licht“ trägt.
alias: Flur-Taster - Abendlichter aus
triggers:
  - trigger: event.received
    target:
      entity_id: event.hall_button
    options:
      event_type:
        - single_press
actions:
  - action: light.turn_off
    target:
      label_id: goodnight_lights
