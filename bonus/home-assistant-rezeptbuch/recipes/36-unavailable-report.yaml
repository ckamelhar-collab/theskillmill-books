# Rezept 36: Eine Montagsliste von allem, was verstummt ist
# Jeden Montagmorgen legt Home Assistant die Liste der nicht verfügbaren Entitäten in die Benachrichtigungsglocke, damit ein toter Sensor nicht wochenlang unbemerkt bleibt.
alias: Montagsliste nicht verfügbarer Entitäten
triggers:
  - trigger: time
    at: "09:00:00"
conditions:
  - condition: time
    weekday:
      - mon
actions:
  - variables:
      gone: >
        {{ states
           | selectattr('state', 'eq', 'unavailable')
           | map(attribute='entity_id')
           | list }}
  - if:
      - condition: template
        value_template: "{{ gone | count > 0 }}"
    then:
      - action: persistent_notification.create
        data:
          notification_id: unavailable_report
          title: Nicht verfügbare Entitäten
          message: >
            {{ gone | count }} Entitäten nicht verfügbar:
            {{ gone[:15] | join(', ') }}
