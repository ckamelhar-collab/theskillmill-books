# Rezept 8: Ein Hausmodus, der sich selbst aktualisiert
# Ein einziger Helfer sagt immer Zuhause oder Weg (später auch Nacht oder Gäste), sodass jede andere Automation nur eine einfache Frage stellen muss.
alias: Hausmodus folgt den Personen
triggers:
  - trigger: state
    entity_id:
      - person.anna
      - person.ben
conditions:
  - condition: state
    entity_id: input_select.house_mode
    state:
      - Home
      - Away
actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.house_mode
    data:
      option: >
        {{ 'Home' if states.person
           | selectattr('state', 'eq', 'home')
           | list | count > 0 else 'Away' }}
