# Recept 12: Een andere wekker op werkdagen en feestdagen
# Het slaapkamerlicht gaat om 06:45 uur langzaam aan, maar alleen op dagen die geen weekend en geen officiële feestdag in jouw land zijn.
alias: Wekkerlicht alleen op werkdagen
triggers:
  - trigger: time
    at: "06:45:00"
conditions:
  - condition: state
    entity_id: binary_sensor.workday_sensor
    state: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 25
      color_temp_kelvin: 2700
      transition: 300
