# Recept 3: Eén knop zet de avondverlichting uit
# Eén druk op een wandknop of afstandsbediening zet elke lamp uit die het label “Goodnight lights” heeft.
alias: Knop in de gang - avondlichten uit
triggers:
  - trigger: event.received
    target:
      entity_id: event.hall_button
    options:
      event_type:
        - single_press
actions:
  - action: light.turn_off
    target:
      label_id: goodnight_lights
