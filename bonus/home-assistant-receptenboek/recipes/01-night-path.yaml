# Recept 1: Een gedimd looplicht naar de badkamer, 's nachts
# Tussen 23:00 en 06:00 uur gaat het licht naar de badkamer op 8 procent aan zodra de bewegingsmelder in de gang iets ziet, en het gaat vanzelf weer uit.
alias: Nachtlicht naar de badkamer
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.hallway_motion
    to: "on"
conditions:
  - condition: time
    after: "23:00:00"
    before: "06:00:00"
actions:
  - action: light.turn_on
    target:
      entity_id: light.bathroom_path
    data:
      brightness_pct: 8
      color_temp_kelvin: 2200
  - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.hallway_motion
        to: "off"
        for:
          seconds: 90
    timeout: "00:10:00"
  - action: light.turn_off
    target:
      entity_id: light.bathroom_path
