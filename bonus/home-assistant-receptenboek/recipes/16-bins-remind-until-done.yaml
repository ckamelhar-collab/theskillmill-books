# Recept 16: Een herinnering die blijft vragen tot je hem afvinkt
# Op dinsdagavond vraagt je telefoon naar de afvalbakken. “Klaar” stopt het. “Over 30 minuten” (of negeren) laat hem opnieuw vragen, hoogstens vier keer.
alias: Afvalbakken - herinneren tot ze buiten staan
triggers:
  - trigger: time
    at: "19:30:00"
conditions:
  - condition: time
    weekday:
      - tue
actions:
  - repeat:
      count: 4
      sequence:
        - action: notify.mobile_app_anna_phone
          data:
            title: Afvalbakken
            message: Afvalbakken buitengezet?
            data:
              tag: bins
              actions:
                - action: BINS_DONE
                  title: Klaar
                - action: BINS_LATER
                  title: Over 30 minuten
        - wait_for_trigger:
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: BINS_DONE
            - trigger: event
              event_type: mobile_app_notification_action
              event_data:
                action: BINS_LATER
          timeout: "00:30:00"
        - if:
            - condition: template
              value_template: >
                {{ wait.trigger is not none
                   and wait.trigger.event.data.action
                       == 'BINS_DONE' }}
          then:
            - stop: Afvalbakken klaar
        - if:
            - condition: template
              value_template: >
                {{ wait.trigger is not none }}
          then:
            - delay:
                minutes: 30
