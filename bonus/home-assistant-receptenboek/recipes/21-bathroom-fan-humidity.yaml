# Recept 21: De badkamerventilator volgt de luchtvochtigheid
# De ventilator start als de lucht na het douchen vochtig wordt en stopt vijf minuten nadat het weer droog is.
alias: Badkamerventilator volgt luchtvochtigheid
triggers:
  - trigger: numeric_state
    entity_id: sensor.bathroom_humidity
    above: 70
    id: humid
  - trigger: numeric_state
    entity_id: sensor.bathroom_humidity
    below: 60
    for:
      minutes: 5
    id: dry
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: humid
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.bathroom_fan
      - conditions:
          - condition: trigger
            id: dry
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.bathroom_fan
