# Recept 13: Een filmstand die alles weer terugzet
# Eén script dimt de kamer en sluit de rolluiken, een tweede brengt elke lamp en elk rolluik precies terug naar hoe het was.
alias: Filmstand aan
sequence:
  - action: scene.create
    data:
      scene_id: before_movie
      snapshot_entities:
        - light.living_room
        - light.kitchen
        - cover.living_room_blinds
  - action: light.turn_off
    target:
      entity_id: light.kitchen
  - action: light.turn_on
    target:
      entity_id: light.living_room
    data:
      brightness_pct: 10
  - action: cover.close_cover
    target:
      entity_id: cover.living_room_blinds
---
alias: Filmstand uit
sequence:
  - action: scene.turn_on
    target:
      entity_id: scene.before_movie
