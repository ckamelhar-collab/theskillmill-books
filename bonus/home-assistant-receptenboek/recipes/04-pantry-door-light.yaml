# Recept 4: Het licht in de kast volgt de deur
# Het licht gaat aan als de deur van de voorraadkast opengaat, uit als hij dichtgaat, en na 15 minuten ook uit als iemand de deur open laat staan.
alias: Kastlicht volgt de deur
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "on"
    id: opened
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "off"
    id: closed
  - trigger: state
    entity_id: binary_sensor.pantry_door
    to: "on"
    for:
      minutes: 15
    id: forgotten
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: opened
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.pantry
      - conditions:
          - condition: trigger
            id:
              - closed
              - forgotten
        sequence:
          - action: light.turn_off
            target:
              entity_id: light.pantry
