# Recept 37: Hoor het als een back-up mislukt of ontbreekt
# Je krijgt een bericht als de automatische back-up mislukt, en nog een als er al twee dagen geen back-up is gelukt.
alias: Back-upprobleem
triggers:
  - trigger: state
    entity_id: event.backup_automatic_backup
    id: event
  - trigger: time
    at: "09:30:00"
    id: age
conditions:
  - condition: template
    value_template: >
      {% if trigger.id == 'event' %}
        {{ trigger.to_state.attributes.event_type
           == 'failed' }}
      {% else %}
        {% set id = 'sensor.backup_last_' ~
                    'successful_automatic_backup' %}
        {{ (now() - states(id) | as_datetime(
              now() - timedelta(days=99))).days
           >= 2 }}
      {% endif %}
actions:
  - action: notify.mobile_app_anna_phone
    data:
      title: Back-up
      message: >
        De laatste automatische back-up is mislukt
        of ouder dan twee dagen.
        Zie Instellingen > Systeem > Back-ups.
