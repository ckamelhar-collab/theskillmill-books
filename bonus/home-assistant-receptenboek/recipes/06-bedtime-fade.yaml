# Recept 6: Een slaaplicht dat langzaam uitgaat
# Je drukt op een knop in het dashboard, het slaapkamerlicht dimt in twee minuten omlaag en gaat dan uit, zodat je kunt lezen tot het donker is.
alias: Slaapkamerlicht om in slaap te vallen
triggers:
  - trigger: state
    entity_id: input_button.bedtime
actions:
  - action: light.turn_on
    target:
      entity_id: light.bedroom
    data:
      brightness_pct: 5
      transition: 120
  - delay:
      minutes: 3
  - action: light.turn_off
    target:
      entity_id: light.bedroom
