# Recept 11: Een ochtendroutine die één keer per dag loopt
# Bij de eerste beweging in de keuken tussen 06:00 en 10:00 uur gaat het licht aan en gaan de rolluiken omhoog. Latere beweging doet tot morgen niets.
alias: Goedemorgen - eerste beweging van de dag
triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion
    to: "on"
conditions:
  - condition: time
    after: "06:00:00"
    before: "10:00:00"
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none
         or as_local(this.attributes.last_triggered)
            .date() != now().date() }}
actions:
  - action: light.turn_on
    target:
      entity_id: light.kitchen
    data:
      brightness_pct: 70
  - action: cover.open_cover
    target:
      entity_id: cover.kitchen_blinds
