# Recept 24: De lader schakelt zichzelf uit als de accu vol is
# Een slimme stekker met vermogensmeting haalt de stroom eraf, tien minuten nadat de lader niets meer opneemt, en laat het je weten.
alias: Lader uit als de accu vol is
triggers:
  - trigger: numeric_state
    entity_id: sensor.ebike_charger_power
    below: 3
    for:
      minutes: 10
conditions:
  - condition: state
    entity_id: switch.ebike_charger
    state: "on"
actions:
  - action: switch.turn_off
    target:
      entity_id: switch.ebike_charger
  - action: notify.mobile_app_anna_phone
    data:
      message: De e-bike is opgeladen. De stekker is uit.
