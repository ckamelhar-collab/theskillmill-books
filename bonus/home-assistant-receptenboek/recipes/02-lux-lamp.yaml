# Recept 2: De lamp gaat aan als het in de kamer donker wordt
# Op een grijze middag gaat de woonkamerlamp aan als het vijf minuten donker is geweest en er iemand in de kamer zit.
alias: Woonkamerlamp bij donker weer
triggers:
  - trigger: numeric_state
    entity_id: sensor.living_room_illuminance
    below: 40
    for:
      minutes: 5
conditions:
  - condition: state
    entity_id: binary_sensor.living_room_presence
    state: "on"
  - condition: time
    after: "08:00:00"
    before: "22:00:00"
actions:
  - action: light.turn_on
    target:
      entity_id: light.living_room_lamp
    data:
      brightness_pct: 60
