# Recept 8: Een huismodus die zichzelf bijwerkt
# Eén helper zegt altijd Home of Away (later ook Night of Guests), zodat elke andere automatisering maar één simpele vraag hoeft te stellen.
alias: Huismodus volgt de personen
triggers:
  - trigger: state
    entity_id:
      - person.anna
      - person.ben
conditions:
  - condition: state
    entity_id: input_select.house_mode
    state:
      - Home
      - Away
actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.house_mode
    data:
      option: >
        {{ 'Home' if states.person
           | selectattr('state', 'eq', 'home')
           | list | count > 0 else 'Away' }}
