# Recept 14: Eén “ik ga weg”-script voor knoppen, spraak en automatiseringen
# Eén script regelt alles wat bij weggaan hoort: licht uit, deur op slot, verwarming op eco, huismodus op Away. Een knop, een spraakopdracht of een andere automatisering kan het starten.
alias: Het huis verlaten
fields:
  lock_door:
    name: Voordeur op slot doen
    default: true
    selector:
      boolean: {}
sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - if:
      - condition: template
        value_template: "{{ lock_door | default(true) }}"
    then:
      - action: lock.lock
        target:
          entity_id: lock.front_door
  - action: climate.set_preset_mode
    target:
      entity_id: climate.living_room
    data:
      preset_mode: eco
  - action: input_select.select_option
    target:
      entity_id: input_select.house_mode
    data:
      option: Away
