# Recept 32: Rook gedetecteerd: alle lampen aan en een luid bericht
# Meldt een rookmelder die Home Assistant kan zien rook, dan gaan alle lampen in huis op volle kracht aan en waarschuwt je telefoon je luid.
alias: Rook - alle lampen aan, telefoonalarm
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.smoke_hallway
      - binary_sensor.smoke_kitchen
    to: "on"
actions:
  - action: light.turn_on
    target:
      entity_id: all
    data:
      brightness_pct: 100
  - action: notify.mobile_app_anna_phone
    data:
      title: Rook
      message: Rook gedetecteerd. Controleer het huis.
      data:
        push:
          sound:
            name: default
            critical: 1
            volume: 1.0
        ttl: 0
        priority: high
